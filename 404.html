<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <title>الصفحة غير موجودة — اللسان العماني</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f7f6f2; --card:#fff; --ink:#1b1d1a; --muted:#6f746a; --accent:#44603f; --accent-soft:#ebf1e8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.9;
    }
    .box {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid rgba(25,28,24,.04);
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(25,28,24,.06);
      padding: 40px 28px;
      text-align: center;
    }
    .mark {
      width: 52px; height: 52px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid; place-items: center;
      font-size: 1.5rem; font-weight: 600;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 6px; }
    p { color: var(--muted); font-size: .92rem; margin: 0 0 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
    }
    .btn:hover { background: #33482f; border-color: #33482f; }
    .btn-ghost { background: #fff; border-color: #e6e4dc; color: var(--ink); }
    .btn-ghost:hover { background: var(--bg); color: var(--ink); }
    .note { margin-top: 24px; font-size: .8rem; color: #9a9e94; }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true">ل</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>الرابط غير صحيح أو أن الصفحة نُقلت.</p>

    <div class="actions">
      <a class="btn" href="/" data-home>العودة إلى الرئيسية</a>
      <a class="btn btn-ghost" href="/" data-search>البحث الشامل</a>
    </div>

    <p class="note">اللسان العماني</p>
  </main>

  <script>
    (function () {
      var base = window.location.pathname.replace(/[^/]*$/, '');
      if (!base) base = './';
      document.querySelectorAll('[data-home]').forEach(function (link) { link.href = base; });
      document.querySelectorAll('[data-search]').forEach(function (link) { link.href = base + 'search.html'; });
    })();
  </script>
</body>
</html>
