<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — اللسان العماني</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#0e6666">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand:#0e6666; --brand-dark:#032f2f; --gold:#c9972f; --muted:#5a7370; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 32px 20px;
      text-align: center;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      color: #12302e;
      background:
        radial-gradient(circle at 15% 20%, rgba(124,211,211,.25), transparent 45%),
        linear-gradient(150deg, #f7fbfa, #eef7f5);
    }
    .mark {
      width: 74px; height: 74px; border-radius: 22px;
      background: linear-gradient(145deg, #0e6666, #2b9b9b);
      display: grid; place-items: center;
      box-shadow: 0 14px 30px rgba(14,102,102,.25);
    }
    .mark svg { width: 44px; height: 44px; }
    .code { font-family: 'Amiri', serif; font-size: 6rem; line-height: 1; color: var(--brand); margin: 0; }
    h1 { font-size: 1.5rem; margin: 0; color: var(--brand-dark); }
    p { color: var(--muted); max-width: 46ch; margin: 0; line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 999px; text-decoration: none;
      font-weight: 700; font-size: .95rem; background: var(--brand); color: #fff;
      transition: transform .2s ease, background .2s ease;
    }
    .btn:hover { background: #0a5d5d; transform: translateY(-2px); }
    .btn-ghost { background: #fff; color: var(--brand); border: 1.5px solid #b6e8e3; }
    .btn-ghost:hover { background: #f0faf8; }
    .brand { margin-top: 14px; font-size: .85rem; color: var(--muted); }
    .brand b { font-family: 'Amiri', serif; font-size: 1.15rem; color: var(--brand); }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 40 40"><path d="M24.5 7.5v17.2a7.8 7.8 0 0 1-7.8 7.8h-3.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.4" cy="9.4" r="2.7" fill="#f2c96b"/></svg>
  </div>

  <p class="code">404</p>
  <h1>عذرًا، هذه الصفحة غير موجودة</h1>
  <p>يبدو أن الرابط الذي تحاول الوصول إليه غير صحيح أو تم نقله. يمكنك العودة إلى الرئيسية أو البحث في المنصة.</p>

  <div class="actions">
    <a class="btn" href="/" data-home>العودة إلى الرئيسية</a>
    <a class="btn btn-ghost" href="/" data-search>البحث الشامل</a>
  </div>

  <div class="brand"><b>اللسان العماني</b> · منصة الظواهر الدلالية</div>

  <script>
    (function () {
      var segments = window.location.pathname.split('/').filter(Boolean);
      var isProjectPage = /\.github\.io$/i.test(window.location.hostname);
      var base = isProjectPage && segments.length ? '/' + segments[0] + '/' : './';
      document.querySelectorAll('[data-home]').forEach(function (link) { link.href = base; });
      document.querySelectorAll('[data-search]').forEach(function (link) { link.href = base + 'search.html'; });
    })();
  </script>
</body>
</html>
