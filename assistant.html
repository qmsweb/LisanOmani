<body data-nav="assistant">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <nav class="breadcrumbs" aria-label="مسار التصفح">
          <a href="index.html">الرئيسية</a><span>›</span><span>المساعد الذكي</span>
        </nav>
        <h1>المساعد الذكي</h1>
        <p>اسأل عن معنى مفردة لهجية، أو مثل في موضوع، أو منطقة عُمانية.</p>
      </div>
    </section>

    <section class="tool-shell">
      <div class="container">
        <div class="panel chat-panel">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>

          <div class="chat-suggestions" id="chat-suggestions">
            <button type="button">ما معنى تو؟</button>
            <button type="button">أمثال عن التعاون</button>
            <button type="button">ما لهجة ظفار؟</button>
            <button type="button">معنى باغي</button>
          </div>

          <form id="chat-form" class="chat-form">
            <label class="sr-only" for="chat-input">اكتب سؤالك</label>
            <input id="chat-input" type="text" placeholder="اكتب سؤالك…" autocomplete="off">
            <button class="btn" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
              إرسال
            </button>
          </form>

          <p class="small muted chat-note">مساعد تجريبي يجيب من بيانات المنصة داخل المتصفح، ولا يتصل بخدمة خارجية.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/assistant.js"></script>
